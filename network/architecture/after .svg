<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">

  <!-- Background -->
  <rect width="900" height="660" fill="#0f1117"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" fill="#27ae60" font-size="15" font-weight="bold">AFTER — Hardened State · Meridian FinServe Analogous Segment</text>
  <text x="450" y="50" text-anchor="middle" fill="#888" font-size="10">Controls derived from PCAP findings · Each layer cites a specific finding from Workstream A</text>

  <!-- INTERNET ZONE -->
  <rect x="20" y="65" width="860" height="115" rx="6" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="82" fill="#888" font-size="11" font-weight="bold">INTERNET — THREAT INFRASTRUCTURE (BLOCKED)</text>

  <!-- blocked C2 -->
  <rect x="40" y="90" width="180" height="75" rx="4" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="130" y="112" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">whitepepper.su</text>
  <text x="130" y="128" text-anchor="middle" fill="#555" font-size="10">153.92.1.49</text>
  <text x="130" y="148" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="bold">✓ BLOCKED — DNS + HTTP</text>

  <!-- blocked staging -->
  <rect x="240" y="90" width="180" height="75" rx="4" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="330" y="112" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">filemegahab4.*</text>
  <text x="330" y="128" text-anchor="middle" fill="#555" font-size="10">.sbs + .lat TLDs</text>
  <text x="330" y="148" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="bold">✓ BLOCKED — TLD DENY LIST</text>

  <!-- blocked other -->
  <rect x="440" y="90" width="200" height="75" rx="4" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <text x="540" y="112" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">Other Suspicious Domains</text>
  <text x="540" y="128" text-anchor="middle" fill="#555" font-size="10">.cc · .cyou · unknown</text>
  <text x="540" y="148" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="bold">✓ BLOCKED — DNS FIREWALL</text>

  <!-- legit still allowed -->
  <rect x="660" y="90" width="200" height="75" rx="4" fill="#0a1a0a" stroke="#27ae60" stroke-width="1"/>
  <text x="760" y="112" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="bold">Legitimate CDN / Cloud</text>
  <text x="760" y="128" text-anchor="middle" fill="#aaa" font-size="9">Cloudflare · Google · Microsoft</text>
  <text x="760" y="148" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="bold">✓ PERMITTED — ALLOWLISTED</text>

  <!-- PERIMETER CONTROLS LAYER -->
  <rect x="20" y="192" width="860" height="60" rx="4" fill="#0a1f0a" stroke="#27ae60" stroke-width="2"/>
  <text x="450" y="212" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="bold">PERIMETER CONTROLS (Finding: whitepepper.su C2 + 7 suspicious DNS domains)</text>
  <text x="110" y="232" text-anchor="middle" fill="#aaa" font-size="9">DNS Firewall</text>
  <text x="110" y="244" text-anchor="middle" fill="#2ecc71" font-size="9">Block .su .cc .lat .sbs .cyou</text>
  <text x="290" y="232" text-anchor="middle" fill="#aaa" font-size="9">HTTP Egress Allowlist</text>
  <text x="290" y="244" text-anchor="middle" fill="#2ecc71" font-size="9">Deny arbitrary :80 outbound</text>
  <text x="480" y="232" text-anchor="middle" fill="#aaa" font-size="9">TLS Inspection</text>
  <text x="480" y="244" text-anchor="middle" fill="#2ecc71" font-size="9">Decrypt sessions to unknown IPs</text>
  <text x="670" y="232" text-anchor="middle" fill="#aaa" font-size="9">WAF</text>
  <text x="670" y="244" text-anchor="middle" fill="#2ecc71" font-size="9">Block /api/set_agent URI pattern</text>
  <text x="820" y="232" text-anchor="middle" fill="#aaa" font-size="9">Effort: S–L</text>

  <!-- SEGMENTATION LAYER -->
  <rect x="20" y="264" width="860" height="50" rx="4" fill="#0a0a1f" stroke="#3498db" stroke-width="2"/>
  <text x="450" y="284" text-anchor="middle" fill="#3498db" font-size="11" font-weight="bold">SEGMENTATION CONTROLS (Finding: SMB direct workstation→DC, LSARPC/SAMR enumeration)</text>
  <text x="160" y="304" text-anchor="middle" fill="#aaa" font-size="9">East-West Firewall: block workstation SMB to DC</text>
  <text x="480" y="304" text-anchor="middle" fill="#aaa" font-size="9">Named pipe filter: SAMR/LSARPC from admin hosts only</text>
  <text x="760" y="304" text-anchor="middle" fill="#aaa" font-size="9">Effort: M</text>

  <!-- WORKSTATION ZONE -->
  <rect x="20" y="325" width="530" height="175" rx="6" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="35" y="342" fill="#27ae60" font-size="11" font-weight="bold">WORKSTATION SEGMENT — HARDENED</text>

  <!-- Hardened workstation -->
  <rect x="140" y="352" width="280" height="135" rx="4" fill="#0a1f0a" stroke="#27ae60" stroke-width="2"/>
  <text x="280" y="374" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">DESKTOP-ES9F3ML</text>
  <text x="280" y="390" text-anchor="middle" fill="#2ecc71" font-size="10">10.1.21.58 · Windows 11</text>
  <text x="280" y="406" text-anchor="middle" fill="#aaa" font-size="9">✓ EDR deployed — C2 callback detection</text>
  <text x="280" y="421" text-anchor="middle" fill="#aaa" font-size="9">✓ Browser extension allowlist (MDM)</text>
  <text x="280" y="436" text-anchor="middle" fill="#aaa" font-size="9">✓ DNS queries logged to SIEM</text>
  <text x="280" y="451" text-anchor="middle" fill="#aaa" font-size="9">✓ HTTP egress via proxy only</text>
  <text x="280" y="468" text-anchor="middle" fill="#27ae60" font-size="9">FINDING: agent=Chrome/Edge injection → browser policy</text>

  <!-- Blocked SMB path -->
  <line x1="420" y1="420" x2="548" y2="420" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="450" y="405" width="60" height="20" rx="3" fill="#3d0000"/>
  <text x="480" y="419" text-anchor="middle" fill="#e74c3c" font-size="9" font-weight="bold">BLOCKED</text>

  <!-- Allowed jump host path -->
  <line x1="420" y1="450" x2="548" y2="450" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="480" y="445" text-anchor="middle" fill="#27ae60" font-size="8">via jump host</text>

  <!-- INTERNAL SERVER ZONE -->
  <rect x="555" y="325" width="325" height="175" rx="6" fill="none" stroke="#3498db" stroke-width="1.5"/>
  <text x="570" y="342" fill="#3498db" font-size="11" font-weight="bold">INTERNAL SEGMENT — HARDENED DC</text>

  <!-- Jump host -->
  <rect x="565" y="352" width="120" height="80" rx="4" fill="#0a0a1f" stroke="#3498db" stroke-width="1.5"/>
  <text x="625" y="372" text-anchor="middle" fill="#3498db" font-size="10" font-weight="bold">Jump Host</text>
  <text x="625" y="388" text-anchor="middle" fill="#aaa" font-size="9">Admin access only</text>
  <text x="625" y="403" text-anchor="middle" fill="#aaa" font-size="9">MFA enforced</text>
  <text x="625" y="418" text-anchor="middle" fill="#aaa" font-size="9">Session recorded</text>

  <!-- DC hardened -->
  <rect x="700" y="352" width="165" height="135" rx="4" fill="#0a0a1f" stroke="#3498db" stroke-width="2"/>
  <text x="782" y="372" text-anchor="middle" fill="#3498db" font-size="11" font-weight="bold">10.1.21.2 — DC</text>
  <text x="782" y="388" text-anchor="middle" fill="#aaa" font-size="9">✓ SMB signing enforced</text>
  <text x="782" y="403" text-anchor="middle" fill="#aaa" font-size="9">✓ AutoRun.inf removed</text>
  <text x="782" y="418" text-anchor="middle" fill="#aaa" font-size="9">✓ SAMR/LSARPC filtered</text>
  <text x="782" y="433" text-anchor="middle" fill="#aaa" font-size="9">✓ Admin access: jump host only</text>
  <text x="782" y="448" text-anchor="middle" fill="#aaa" font-size="9">✓ SIEM alert on pipe access</text>
  <text x="782" y="468" text-anchor="middle" fill="#3498db" font-size="9">FINDING: LSARPC/SAMR 7k frames</text>

  <!-- Jump host to DC arrow -->
  <line x1="685" y1="400" x2="700" y2="400" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- OBSERVABILITY + RESPONSE LAYER -->
  <rect x="20" y="512" width="860" height="60" rx="4" fill="#1a1000" stroke="#f39c12" stroke-width="2"/>
  <text x="450" y="532" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="bold">OBSERVABILITY + RESPONSE (Finding: 10-min compromise window — zero alerts triggered)</text>
  <text x="120" y="552" text-anchor="middle" fill="#aaa" font-size="9">NSM on egress</text>
  <text x="120" y="564" text-anchor="middle" fill="#2ecc71" font-size="9">Zeek/Suricata</text>
  <text x="290" y="552" text-anchor="middle" fill="#aaa" font-size="9">DNS anomaly alerting</text>
  <text x="290" y="564" text-anchor="middle" fill="#2ecc71" font-size="9">TLD + freq baseline</text>
  <text x="460" y="552" text-anchor="middle" fill="#aaa" font-size="9">App logs → SIEM</text>
  <text x="460" y="564" text-anchor="middle" fill="#2ecc71" font-size="9">Correlation rules</text>
  <text x="640" y="552" text-anchor="middle" fill="#aaa" font-size="9">Isolation playbook</text>
  <text x="640" y="564" text-anchor="middle" fill="#2ecc71" font-size="9">Auto-quarantine trigger</text>
  <text x="810" y="552" text-anchor="middle" fill="#aaa" font-size="9">Effort: S–M</text>

  <!-- DIFF SUMMARY -->
  <rect x="20" y="585" width="860" height="60" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <text x="40" y="604" fill="#fff" font-size="10" font-weight="bold">DIFF SUMMARY — what changed and why</text>
  <text x="40" y="620" fill="#27ae60" font-size="9">✓ DNS firewall blocks .su/.cc/.lat/.sbs/.cyou  ✓ HTTP egress allowlist  ✓ TLS inspection to unknown IPs  ✓ SMB east-west blocked</text>
  <text x="40" y="635" fill="#27ae60" font-size="9">✓ Named pipe filter (SAMR/LSARPC)  ✓ AutoRun.inf removed  ✓ Jump host for DC admin  ✓ EDR + browser policy  ✓ SIEM alerting active</text>
  <text x="40" y="650" fill="#888" font-size="9">Trade-off: TLS inspection may break cert-pinned apps · SMB segmentation requires file-share audit · Browser allowlist needs MDM</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3498db"/>
    </marker>
  </defs>

</svg>
