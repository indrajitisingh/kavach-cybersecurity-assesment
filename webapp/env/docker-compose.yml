version: '3'

services:

  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8080:80"
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true  

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: always
    security_opt:
      - no-new-privileges:true
    read-only: true
  